server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long cache for hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The promo landing is a plain static page, deliberately not part of the
    # SPA: it is a light theme carrying its own CSS reset, and loading that
    # stylesheet into the dark app would wreck every screen. Its filenames are
    # not content-hashed, so it is cached briefly and revalidated instead.
    location ^~ /promo/assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # "/" is the landing, for visitors who have never signed in. Exact matches
    # only — every other path still falls through to the SPA below, and a
    # signed-in visitor is sent to /app by a script in the page itself.
    location = / {
        try_files /promo/index.html =404;
    }

    location = /about {
        try_files /promo/index.html =404;
    }

    # SPA fallback — every other route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
